name: Release

# Push a tag like v0.2.0 to build Shot.dmg and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: SHOT_SIGN_IDENTITY=- ./scripts/bundle.sh
      - run: ./scripts/dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/Shot-*.dmg \
            --title "Shot ${GITHUB_REF_NAME#v}" --generate-notes
