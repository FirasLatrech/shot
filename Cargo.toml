[workspace]
resolver = "2"
members = ["crates/shot-core", "crates/app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Firas Latrach"]
rust-version = "1.85"
readme = "README.md"
keywords = ["screenshot", "macos", "annotation", "screen-capture"]
categories = ["multimedia::images", "gui"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "thin"
codegen-units = 1
